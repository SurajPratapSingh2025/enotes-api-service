spring:
  application:
    name: enotes-api-service
  profiles:
    active: dev
server:
   port: 9090    
---
# dev config
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enotes_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: rootsystem
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: none    
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: smtp.gmail.com
    username: techlife246@gmail.com
    password: nflw mgjz qlld huay
    port: 587
    properties:
      mail:
        smtp:
          auth: true
        starttls:
          enable: true       
springdoc:
   swagger-ui:
      operationsSorter: method
      tagsSorter: alpha
      path: /enotes-doc
   api-docs:
      path: /enotes-api-doc
management:
   endpoints:
      web:
         exposure:
            include: '*'
            exclude: beans,loggers
   endpoint:
      shutdown:
         enabled: true
